<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Hasil | PB Jgeer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { brand: { maroon: '#7A1020', rose: '#D6455D', dark: '#0B0B0B', card: '#161616' } },
            fontFamily: { display: ['Oswald', 'sans-serif'], body: ['Inter', 'sans-serif'] },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
        #loadingOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(4px); }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #D6455D; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-brand-dark text-white antialiased min-h-screen flex flex-col font-body">

<div id="loadingOverlay">
    <div class="flex flex-col items-center gap-4">
        <div class="spinner"></div>
        <p class="font-display uppercase tracking-widest text-brand-rose font-bold">Memuat Data...</p>
    </div>
</div>

<!-- NAVBAR DENGAN LOGO & TOMBOL LEADERBOARD -->
<header class="sticky top-0 z-50 bg-brand-dark/95 backdrop-blur border-b border-brand-maroon/60">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <a href="https://amrylr.github.io/jgeerbadminton/#leaderboard" class="flex items-center gap-2 group cursor-pointer hover:opacity-90 transition">
            <img src="https://raw.githubusercontent.com/amrylr/sirekapjgeer/d5ee3532961526eb61ee71dfd3696db33cdc10f6/LOGOJGEER.png" alt="Logo PB Jgeer" class="h-10 w-auto" />
            <span class="font-display text-2xl font-bold tracking-wide uppercase">
                PB <span class="text-brand-rose group-hover:text-white transition">Jgeer</span>
            </span>
        </a>
        <ul class="flex items-center gap-2 font-display uppercase tracking-wider text-sm">
            <li><a href="https://amrylr.github.io/jgeerbadminton/#leaderboard" class="hidden sm:inline-block px-4 py-2 rounded text-neutral-400 hover:text-brand-rose hover:bg-white/5 transition mr-2">🏆 Leaderboard</a></li>
            <li><button id="btnPlayer" onclick="switchTab('player')" class="px-5 py-2 rounded bg-brand-maroon text-white font-semibold transition shadow-[0_4px_14px_0_rgba(122,16,32,0.39)]">Pemain</button></li>
            <li><button id="btnAdmin" onclick="switchTab('admin')" class="px-5 py-2 rounded text-neutral-400 hover:text-brand-rose hover:bg-white/5 transition">Admin</button></li>
        </ul>
    </nav>
</header>

<main class="max-w-5xl mx-auto px-4 sm:px-6 py-10 w-full flex-1">
    
    <!-- HALAMAN PEMAIN -->
    <div id="playerView" class="space-y-8">
        <div class="rounded-2xl bg-brand-card border border-white/10 p-6 sm:p-8 shadow-2xl">
            <h2 class="font-display uppercase text-2xl font-bold tracking-wide mb-1">Input Pertandingan</h2>
            <p class="text-sm text-neutral-400 mb-6">Data yang dikirim akan masuk ke antrean verifikasi Admin.</p>
            
            <form id="playerForm" class="space-y-6">
                <div>
                    <label class="text-xs text-neutral-400 uppercase tracking-widest block mb-1">Tanggal Pertandingan</label>
                    <input type="date" id="p_tanggal" class="w-full bg-black/60 border border-white/20 rounded px-4 py-3 text-white focus:outline-none focus:border-brand-rose transition" required onchange="fetchHistory()">
                </div>
                
                <div class="grid gap-6 md:grid-cols-2">
                    <div class="bg-black/40 border border-white/5 p-5 rounded-xl">
                        <label class="font-display uppercase tracking-widest text-brand-rose text-sm mb-3 block">Tim A</label>
                        <select id="p_tA_p1" class="w-full bg-brand-card border border-white/10 rounded px-3 py-2.5 text-white mb-3 outline-none" required></select>
                        <select id="p_tA_p2" class="w-full bg-brand-card border border-white/10 rounded px-3 py-2.5 text-white mb-5 outline-none" required></select>
                        
                        <label class="text-xs text-neutral-400 uppercase tracking-widest block mb-2">Skor Menang (Win)</label>
                        <div class="flex gap-2 mb-2">
                            <button type="button" id="btn-p_A-2" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('p_', 'A', 2)">2</button>
                            <button type="button" id="btn-p_A-1" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('p_', 'A', 1)">1</button>
                            <button type="button" id="btn-p_A-0" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('p_', 'A', 0)">0</button>
                        </div>
                        <input type="number" id="p_scoreA" class="w-full bg-black/50 border border-white/5 rounded px-3 py-2 text-neutral-500 font-bold outline-none cursor-not-allowed text-center" readonly required placeholder="Klik tombol skor di atas">
                    </div>

                    <div class="bg-black/40 border border-white/5 p-5 rounded-xl">
                        <label class="font-display uppercase tracking-widest text-neutral-300 text-sm mb-3 block">Tim B</label>
                        <select id="p_tB_p1" class="w-full bg-brand-card border border-white/10 rounded px-3 py-2.5 text-white mb-3 outline-none" required></select>
                        <select id="p_tB_p2" class="w-full bg-brand-card border border-white/10 rounded px-3 py-2.5 text-white mb-5 outline-none" required></select>
                        
                        <label class="text-xs text-neutral-400 uppercase tracking-widest block mb-2">Skor Menang (Win)</label>
                        <div class="flex gap-2 mb-2">
                            <button type="button" id="btn-p_B-2" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('p_', 'B', 2)">2</button>
                            <button type="button" id="btn-p_B-1" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('p_', 'B', 1)">1</button>
                            <button type="button" id="btn-p_B-0" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('p_', 'B', 0)">0</button>
                        </div>
                        <input type="number" id="p_scoreB" class="w-full bg-black/50 border border-white/5 rounded px-3 py-2 text-neutral-500 font-bold outline-none cursor-not-allowed text-center" readonly required placeholder="Klik tombol skor di atas">
                    </div>
                </div>
                <button type="submit" class="w-full py-4 rounded-xl bg-brand-rose hover:bg-brand-maroon text-white font-display font-bold uppercase tracking-wider transition shadow-lg">Kirim Antrean</button>
            </form>
        </div>

        <!-- Riwayat Tabel -->
        <div class="rounded-2xl bg-brand-card border border-white/10 shadow-2xl overflow-hidden">
            <div class="px-6 py-5 bg-gradient-to-r from-brand-maroon/80 to-brand-card border-b border-white/10">
                <h2 class="font-display uppercase text-xl font-bold tracking-wide">Riwayat Hari Ini (Terverifikasi)</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left whitespace-nowrap">
                    <thead>
                        <tr class="font-display uppercase tracking-widest text-xs text-neutral-400 border-b border-white/10 bg-black/40">
                            <th class="px-6 py-4">Nama Pemain</th>
                            <th class="px-4 py-4 text-center text-green-400">Win</th>
                            <th class="px-4 py-4 text-center text-rose-500">Lose</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- HALAMAN ADMIN -->
    <div id="adminView" class="hidden space-y-8">
        <div id="adminLogin" class="max-w-md mx-auto rounded-2xl bg-brand-card border border-white/10 p-8 shadow-2xl text-center">
            <span class="text-4xl mb-4 block" aria-hidden="true">🔒</span>
            <h2 class="font-display uppercase text-2xl font-bold tracking-wide mb-6">Akses Admin</h2>
            <input type="password" id="adminPwd" placeholder="Masukkan Password" class="w-full bg-black/60 border border-white/20 rounded px-4 py-3 text-white text-center tracking-widest mb-4 outline-none">
            <button onclick="checkAdmin()" class="w-full py-3 rounded bg-white text-black font-display font-bold uppercase tracking-wider hover:bg-gray-200 transition">Buka Kunci</button>
        </div>

        <div id="adminDashboard" class="hidden space-y-8">
            <!-- Pending List -->
            <div class="rounded-2xl bg-brand-card border border-white/10 shadow-2xl p-6 sm:p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-display uppercase text-2xl font-bold tracking-wide">Antrean Verifikasi</h2>
                    <button onclick="loadPending()" class="text-xs flex items-center gap-1 bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded transition">🔄 Refresh</button>
                </div>
                <div id="pendingList" class="space-y-4"></div>
            </div>

            <!-- Direct Input -->
            <div class="rounded-2xl bg-brand-card border border-brand-maroon/60 p-6 sm:p-8 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-brand-maroon text-white text-xs font-bold px-3 py-1 rounded-bl-lg">NO VERIFY</div>
                <h2 class="font-display uppercase text-2xl font-bold tracking-wide mb-1 text-brand-rose">Input Langsung</h2>
                <p class="text-sm text-neutral-400 mb-6">Data dikirim akan langsung menjumlahkan skor di Valid.</p>
                
                <form id="adminDirectForm" class="space-y-6">
                    <div>
                        <label class="text-xs text-neutral-400 uppercase tracking-widest block mb-1">Tanggal</label>
                        <input type="date" id="a_tanggal" class="w-full bg-black/60 border border-white/20 rounded px-4 py-3 text-white outline-none" required>
                    </div>
                    
                    <div class="grid gap-6 md:grid-cols-2">
                        <div class="bg-black/40 border border-white/5 p-5 rounded-xl">
                            <label class="font-display uppercase tracking-widest text-brand-rose text-sm mb-3 block">Tim A</label>
                            <select id="a_tA_p1" class="w-full bg-brand-card border border-white/10 rounded px-3 py-2 text-white mb-3" required></select>
                            <select id="a_tA_p2" class="w-full bg-brand-card border border-white/10 rounded px-3 py-2 text-white mb-5" required></select>
                            <div class="flex gap-2 mb-2">
                                <button type="button" id="btn-a_A-2" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('a_', 'A', 2)">2</button>
                                <button type="button" id="btn-a_A-1" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('a_', 'A', 1)">1</button>
                                <button type="button" id="btn-a_A-0" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('a_', 'A', 0)">0</button>
                            </div>
                            <input type="number" id="a_scoreA" class="w-full bg-black/50 border border-white/5 rounded px-3 py-2 text-neutral-500 font-bold outline-none cursor-not-allowed text-center" readonly required placeholder="Klik skor di atas">
                        </div>
                        <div class="bg-black/40 border border-white/5 p-5 rounded-xl">
                            <label class="font-display uppercase tracking-widest text-neutral-300 text-sm mb-3 block">Tim B</label>
                            <select id="a_tB_p1" class="w-full bg-brand-card border border-white/10 rounded px-3 py-2 text-white mb-3" required></select>
                            <select id="a_tB_p2" class="w-full bg-brand-card border border-white/10 rounded px-3 py-2 text-white mb-5" required></select>
                            <div class="flex gap-2 mb-2">
                                <button type="button" id="btn-a_B-2" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('a_', 'B', 2)">2</button>
                                <button type="button" id="btn-a_B-1" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('a_', 'B', 1)">1</button>
                                <button type="button" id="btn-a_B-0" class="flex-1 py-2 rounded font-bold bg-brand-card border border-white/10 text-neutral-400 hover:text-white hover:border-brand-rose transition" onclick="setScore('a_', 'B', 0)">0</button>
                            </div>
                            <input type="number" id="a_scoreB" class="w-full bg-black/50 border border-white/5 rounded px-3 py-2 text-neutral-500 font-bold outline-none cursor-not-allowed text-center" readonly required placeholder="Klik skor di atas">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-4 rounded-xl bg-brand-maroon hover:bg-red-800 text-white font-display font-bold uppercase tracking-wider transition">Input Langsung ke Valid</button>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    // MASUKKAN URL WEB APP GOOGLE SCRIPT YANG BARU DI SINI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzjQxPCSFAvAQEiK-p-HdkgkcRguZ_pXt5DtL0McQSExXGY4cmviN3PBnOmA6nOD5AN/exec"; 

    // PENGATURAN TANGGAL HARI INI & LIMITASI TANGGAL
    const tzOffset = (new Date()).getTimezoneOffset() * 60000; 
    const localDate = new Date(Date.now() - tzOffset);
    const todayYMD = localDate.toISOString().split('T')[0]; 
    
    // Mencegah input tanggal lebih dari hari ini
    const pTanggal = document.getElementById('p_tanggal');
    const aTanggal = document.getElementById('a_tanggal');
    
    pTanggal.value = todayYMD;
    pTanggal.max = todayYMD; 
    aTanggal.value = todayYMD;
    aTanggal.max = todayYMD;

    // TOMBOL SKOR CEPAT
    function setScore(prefix, team, val) {
        const opponent = team === 'A' ? 'B' : 'A';
        
        // Atur nilai input hidden/readonly
        document.getElementById(prefix + 'score' + team).value = val;
        if (val === 2) document.getElementById(prefix + 'score' + opponent).value = 0;
        else if (val === 1) document.getElementById(prefix + 'score' + opponent).value = 1;
        else if (val === 0) document.getElementById(prefix + 'score' + opponent).value = 2;
        
        // Update warna tombol
        ['A', 'B'].forEach(t => {
            const currentVal = document.getElementById(prefix + 'score' + t).value;
            [0, 1, 2].forEach(v => {
                const btn = document.getElementById(`btn-${prefix}${t}-${v}`);
                if (String(v) === currentVal) {
                    btn.classList.add('bg-brand-rose', 'border-brand-rose', 'text-white');
                    btn.classList.remove('bg-brand-card', 'border-white/10', 'text-neutral-400');
                } else {
                    btn.classList.remove('bg-brand-rose', 'border-brand-rose', 'text-white');
                    btn.classList.add('bg-brand-card', 'border-white/10', 'text-neutral-400');
                }
            });
        });
    }

    // RESET TOMBOL SKOR UI
    function resetScoreButtons(prefix) {
        ['A', 'B'].forEach(t => {
            [0, 1, 2].forEach(v => {
                const btn = document.getElementById(`btn-${prefix}${t}-${v}`);
                btn.classList.remove('bg-brand-rose', 'border-brand-rose', 'text-white');
                btn.classList.add('bg-brand-card', 'border-white/10', 'text-neutral-400');
            });
        });
    }

    function showLoading(show) { document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; }
    
    window.onload = function() {
        fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({action: "getInitData", date: todayYMD}) })
        .then(res => res.json()).then(res => {
            if(res.status === "success") {
                populateSelects(res.names);
                renderHistory(res.history);
                showLoading(false);
            }
        }).catch(err => { 
            console.log(err); alert("Gagal memuat data."); showLoading(false); 
        });
    }

    function populateSelects(names) {
        const ids = ['p_tA_p1', 'p_tA_p2', 'p_tB_p1', 'p_tB_p2', 'a_tA_p1', 'a_tA_p2', 'a_tB_p1', 'a_tB_p2'];
        let options = '<option value="">-- Pilih Pemain --</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
        ids.forEach(id => document.getElementById(id).innerHTML = options);
    }

    function fetchHistory() {
        showLoading(true);
        const selectedDate = document.getElementById('p_tanggal').value; 
        fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({action: "getHistory", date: selectedDate}) })
        .then(res => res.json()).then(res => {
            renderHistory(res.history); showLoading(false);
        });
    }

    function renderHistory(data) {
        const tbody = document.getElementById('historyTableBody');
        tbody.innerHTML = "";
        const validData = data.filter(row => row[1] && row[1].trim() !== "");

        if(validData.length === 0) { 
            tbody.innerHTML = "<tr><td colspan='3' class='text-center py-8 text-neutral-500 italic'>Belum ada pertandingan terverifikasi pada tanggal ini</td></tr>"; 
            return; 
        }
        validData.forEach(row => {
            tbody.innerHTML += `
            <tr class="hover:bg-white/5 transition border-b border-white/5">
                <td class="px-6 py-4 font-semibold">${row[1]}</td>
                <td class="px-4 py-4 text-center font-bold text-green-400">${row[3]}</td>
                <td class="px-4 py-4 text-center font-bold text-rose-500">${row[4]}</td>
            </tr>`;
        });
    }

    document.getElementById('playerForm').addEventListener('submit', function(e) { e.preventDefault(); submitMatchData('p_', 'submitPending'); });
    document.getElementById('adminDirectForm').addEventListener('submit', function(e) { e.preventDefault(); submitMatchData('a_', 'submitDirect'); });

    function submitMatchData(prefix, actionType) {
        showLoading(true);
        const dateVal = document.getElementById(prefix+'tanggal').value;
        const dObj = new Date(dateVal);
        const blnList = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        
        const payload = {
            action: actionType,
            data: {
                tanggal: dateVal, bulan: blnList[dObj.getMonth()],
                tA_p1: document.getElementById(prefix+'tA_p1').value,
                tA_p2: document.getElementById(prefix+'tA_p2').value,
                scoreA: document.getElementById(prefix+'scoreA').value,
                tB_p1: document.getElementById(prefix+'tB_p1').value,
                tB_p2: document.getElementById(prefix+'tB_p2').value,
                scoreB: document.getElementById(prefix+'scoreB').value
            }
        };

        fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json()).then(res => {
            showLoading(false);
            alert("Data Berhasil Dikirim!");
            if(actionType === 'submitDirect') loadPending(); 
            if(actionType === 'submitPending') fetchHistory(); 
            
            document.getElementById(prefix === 'p_' ? 'playerForm' : 'adminDirectForm').reset();
            document.getElementById(prefix+'tanggal').value = dateVal;
            resetScoreButtons(prefix); // Mengembalikan UI skor
        });
    }

    function switchTab(tab) {
        document.getElementById('btnPlayer').className = tab === 'player' ? 'px-5 py-2 rounded bg-brand-maroon text-white font-semibold transition shadow-[0_4px_14px_0_rgba(122,16,32,0.39)]' : 'px-5 py-2 rounded text-neutral-400 hover:text-brand-rose hover:bg-white/5 transition';
        document.getElementById('btnAdmin').className = tab === 'admin' ? 'px-5 py-2 rounded bg-brand-maroon text-white font-semibold transition shadow-[0_4px_14px_0_rgba(122,16,32,0.39)]' : 'px-5 py-2 rounded text-neutral-400 hover:text-brand-rose hover:bg-white/5 transition';
        
        document.getElementById('playerView').style.display = tab === 'player' ? 'block' : 'none';
        document.getElementById('adminView').style.display = tab === 'admin' ? 'block' : 'none';
        
        if (tab === 'player') fetchHistory();
    }

    function checkAdmin() {
        if(document.getElementById('adminPwd').value === "ytta") {
            document.getElementById('adminLogin').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadPending();
        } else { alert("Password Salah!"); }
    }

    function loadPending() {
        const list = document.getElementById('pendingList');
        list.innerHTML = `<p class="text-neutral-400 italic">Memuat antrean...</p>`;
        
        fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({action: "getPending"}) })
        .then(res => res.json()).then(res => {
            list.innerHTML = "";
            if(res.pending.length === 0) { list.innerHTML = `<p class="text-neutral-500">Tidak ada antrean verifikasi.</p>`; return; }
            
            res.pending.forEach(row => {
                list.innerHTML += `
                    <div class="bg-black/40 border-l-4 border-brand-rose p-4 sm:p-5 rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4" id="card-${row[0]}">
                        <div>
                            <span class="text-xs text-neutral-400 uppercase tracking-widest block mb-1">Tanggal: ${row[1]}</span>
                            <p class="text-sm sm:text-base">
                                <strong class="text-white">${row[3]} & ${row[4]}</strong> <span class="text-green-400 font-bold">(${row[5]})</span> 
                                <span class="mx-2 text-neutral-500">VS</span> 
                                <strong class="text-white">${row[6]} & ${row[7]}</strong> <span class="text-green-400 font-bold">(${row[8]})</span>
                            </p>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                            <button class="flex-1 sm:flex-none bg-green-600 hover:bg-green-500 text-white px-5 py-2 rounded font-semibold transition shadow-lg text-sm" onclick="verifyMatch('${row[0]}')">Setujui</button>
                            <button class="flex-1 sm:flex-none bg-brand-card border border-white/10 hover:bg-brand-rose hover:border-brand-rose text-neutral-300 hover:text-white px-5 py-2 rounded font-semibold transition shadow-lg text-sm" onclick="deleteMatch('${row[0]}')">Tolak</button>
                        </div>
                    </div>`;
            });
        });
    }

    function verifyMatch(id) {
        showLoading(true);
        fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({action: "verifyMatch", id: id}) })
        .then(res => res.json()).then(res => {
            showLoading(false);
            if(res.status === "success") {
                document.getElementById(`card-${id}`).style.display = 'none';
                fetchHistory(); 
            }
        });
    }

    // FITUR BARU: Hapus data (Tolak)
    function deleteMatch(id) {
        if(!confirm("Yakin ingin menolak dan menghapus data antrean ini?")) return;
        
        showLoading(true);
        fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({action: "deleteMatch", id: id}) })
        .then(res => res.json()).then(res => {
            showLoading(false);
            if(res.status === "success") {
                document.getElementById(`card-${id}`).style.display = 'none';
            }
        });
    }
</script>
</body>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PB Jgeer — Kami Pindah Alamat</title>
<meta name="robots" content="noindex">
<style>
:root{--m:#8b1a2b;--g:#ff3d5a}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 30%,#2b0a11,#0a0a0a 70%);overflow:hidden;padding:16px}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;animation:fl 9s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:var(--m);top:-80px;left:-80px}
.o2{width:260px;height:260px;background:var(--g);bottom:-80px;right:-60px;animation-delay:-4s}
@keyframes fl{to{transform:translate(40px,30px) scale(1.2)}}
.card{position:relative;z-index:1;text-align:center;max-width:380px;width:100%;padding:36px 24px;border-radius:28px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);box-shadow:0 20px 60px #0008;animation:in .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.92)}}
.ring{width:110px;height:110px;margin:0 auto 22px;position:relative;display:grid;place-items:center}
.ring i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--g);animation:sp 1.2s linear infinite}
.ring i+i{inset:12px;border-top-color:#fff;animation-duration:1.8s;animation-direction:reverse}
.ring b{font-size:2.2rem;animation:bn 1s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bn{50%{transform:translateY(-6px) rotate(-15deg)}}
h1{font-size:1.4rem;margin-bottom:8px}
p{font-size:.92rem;opacity:.8;line-height:1.5}
.url{display:block;margin:16px 0;padding:10px;border-radius:12px;background:#0006;font-size:.8rem;word-break:break-all;color:#ffb3bf}
.bar{height:6px;border-radius:9px;background:#fff2;overflow:hidden;margin:18px 0 8px}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--m),var(--g));animation:ld 2s linear forwards}
@keyframes ld{to{width:100%}}
.btn{display:inline-block;margin-top:10px;padding:12px 26px;border-radius:99px;background:linear-gradient(135deg,var(--m),var(--g));color:#fff;text-decoration:none;font-weight:700;box-shadow:0 6px 24px #ff3d5a55;transition:transform .2s}
.btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<main class="card">
  <div class="ring"><i></i><i></i><b>🏸</b></div>
  <h1>PB Jgeer Pindah Rumah!</h1>
  <p>Alamat website sudah diperbarui. Kamu akan dialihkan otomatis dalam <b id="c">2</b> detik.</p>
  <span class="url" id="u"></span>
  <div class="bar"><span></span></div>
  <a class="btn" id="b" href="#">Buka Sekarang</a>
</main>
<script>
// === GANTI DENGAN ALAMAT BARU (tanpa garis miring di akhir) ===
const NEW_URL = "https://pbjgeer.github.io/apk/report.html";
// ==============================================================
const f = location.pathname.split("/").pop();
const page = /\.html?$/.test(f) && !/^(index|redirect)\.html?$/.test(f) ? f : "";
const dest = NEW_URL + page + location.search + location.hash;
u.textContent = "pbjgeer.github.io/apk"; b.href = dest;
if (location.href.startsWith(NEW_URL)) { document.body.innerHTML=""; }
else {
  let n = 2;
  const i = setInterval(()=>{ c.textContent = --n; if(n<=0){clearInterval(i);location.replace(dest);} },1000);
}
</script>
<noscript><meta http-equiv="refresh" content="1;url=https://pbjgeer.github.io/apk/report.html"></noscript>
</body>
</html>
